# SAS OS - debian-installer preseed
#
# Placeholders written in at-sign-delimited uppercase are substituted from
# sas.conf at build time by scripts/build-native.sh, which then verifies that
# none were left behind. Edit sas.conf, not the substituted values.
#
# Design note: user account creation is deliberately NOT preseeded, so the
# installer still prompts for the username and password on every install.

### Locale and keyboard
d-i debian-installer/locale string @LOCALE@
d-i localechooser/supported-locales multiselect @LOCALE@
d-i keyboard-configuration/xkb-keymap select @KEYMAP@

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string @HOSTNAME@
d-i netcfg/get_domain string local

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string @MIRROR_HOST@
d-i mirror/http/directory string @MIRROR_PATH@
d-i mirror/http/proxy string

### Accounts
# Root login stays disabled; the first user gets sudo instead.
d-i passwd/root-login boolean false
# Intentionally left unset so the installer prompts:
#   passwd/user-fullname, passwd/username,
#   passwd/user-password, passwd/user-password-again
d-i passwd/user-default-groups string audio cdrom video sudo netdev plugdev

### Clock and timezone
d-i clock-setup/utc boolean true
d-i time/zone string @TIMEZONE@
d-i clock-setup/ntp boolean true

### Partitioning
# "atomic" = everything in one partition. The installer still asks for
# confirmation before writing, so nothing is destroyed silently.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Package selection
# Nothing to select. The installer runs in `live` mode: it copies the
# squashfs built from config/package-lists/ directly onto the disk, so the
# installed system is exactly the image you booted and no network is needed
# during installation. Add or remove software by editing the package lists.
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

### Finish
d-i finish-install/reboot_in_progress note
