# SAS OS - UEFI (GRUB) boot configuration.
#
# live-build sources the grub-pc bootloader directory for the grub-efi
# bootloader as well; this file is overlaid on top of the stock template by
# scripts/build-native.sh.

set default=0
set timeout=10

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Install SAS OS (graphical)" {
    linux  /install/gtk/vmlinuz priority=critical --- quiet
    initrd /install/gtk/initrd.gz
}

menuentry "Install SAS OS (text mode)" {
    linux  /install/vmlinuz priority=critical --- quiet
    initrd /install/initrd.gz
}

menuentry "Try SAS OS (live session, no changes to disk)" {
    linux  /live/vmlinuz boot=live components quiet splash
    initrd /live/initrd.img
}

menuentry "Install SAS OS (expert, all questions)" {
    linux  /install/gtk/vmlinuz priority=low ---
    initrd /install/gtk/initrd.gz
}
