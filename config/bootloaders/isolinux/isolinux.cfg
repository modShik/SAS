# SAS OS - BIOS (isolinux) boot configuration.
#
# Deliberately plain text rather than vesamenu/gfxboot: no dependency on
# menu.c32, splash images or a working VESA mode, so it boots on anything.
# This file is overlaid on top of live-build's stock isolinux template by
# scripts/build-native.sh, so the .c32 modules it ships remain available.

default install
prompt 1
timeout 100

say
say ==========================================
say            SAS OS Installer
say ==========================================
say
say   install      Graphical installer (default)
say   installtext  Text-mode installer
say   live         Try SAS OS without installing
say   expert       Graphical installer, all questions
say
say   Press ENTER for the default, or type a name.
say

label live
    kernel /live/vmlinuz
    append initrd=/live/initrd.img boot=live components quiet splash

label install
    kernel /install/gtk/vmlinuz
    append initrd=/install/gtk/initrd.gz priority=critical --- quiet

label installgui
    kernel /install/gtk/vmlinuz
    append initrd=/install/gtk/initrd.gz priority=critical --- quiet

label installtext
    kernel /install/vmlinuz
    append initrd=/install/initrd.gz priority=critical --- quiet

label expert
    kernel /install/gtk/vmlinuz
    append initrd=/install/gtk/initrd.gz priority=low ---
