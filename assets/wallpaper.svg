<?xml version="1.0" encoding="UTF-8"?>
<!--
  SAS OS default wallpaper.
  Source of truth: this vector file. scripts/gen-wallpaper.sh rasterises it to
  1920x1080 PNG at build time, so no network fetch is involved and the result
  is byte-identical on every build.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0f2027"/>
      <stop offset="55%"  stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.55">
      <stop offset="0%"   stop-color="#5ad1e6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5ad1e6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- Decorative arcs -->
  <g fill="none" stroke="#7fdbe8" stroke-opacity="0.10">
    <circle cx="960" cy="496" r="240" stroke-width="1.5"/>
    <circle cx="960" cy="496" r="360" stroke-width="1"/>
    <circle cx="960" cy="496" r="480" stroke-width="0.75"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Ubuntu, DejaVu Sans, sans-serif" text-anchor="middle">
    <text x="960" y="520" font-size="150" font-weight="bold"
          fill="#ffffff" letter-spacing="18">SAS OS</text>
    <text x="960" y="588" font-size="30" font-weight="normal"
          fill="#9fd4e0" letter-spacing="9">DEVELOPMENT ENVIRONMENT</text>
  </g>

  <line x1="760" y1="618" x2="1160" y2="618" stroke="#7fdbe8" stroke-opacity="0.35" stroke-width="2"/>
</svg>
