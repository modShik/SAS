# SAS OS build settings.
#
# Sourced by scripts/build-native.sh. Every value can be overridden from the
# environment, e.g.  TIMEZONE=Asia/Kolkata ./build.sh

# --- Image identity ---------------------------------------------------------
: "${ISO_NAME:=SAS.iso}"           # final filename in dist/
: "${ISO_VOLUME:=SAS_INSTALLER}"   # ISO9660 volume id (max 32 chars, A-Z0-9_)
: "${ISO_APPLICATION:=SAS OS}"
: "${ISO_PUBLISHER:=SAS}"

# --- Debian base ------------------------------------------------------------
: "${DISTRIBUTION:=bookworm}"
: "${ARCHITECTURE:=amd64}"
: "${ARCHIVE_AREAS:=main contrib non-free non-free-firmware}"
: "${MIRROR_HOST:=deb.debian.org}"
: "${MIRROR_PATH:=/debian}"

# --- Installer defaults (substituted into config/includes.installer/preseed.cfg)
# The installer still prompts for username and password regardless of these.
: "${LOCALE:=en_US.UTF-8}"
: "${KEYMAP:=us}"
: "${TIMEZONE:=Etc/UTC}"
# Not named HOSTNAME: bash sets that variable itself, so the default would
# never apply and the build host's own hostname would leak into the image.
: "${TARGET_HOSTNAME:=sasos}"

# --- Build layout -----------------------------------------------------------
# Working tree for live-build. Needs ~15 GB free and must not be on tmpfs.
: "${WORK_DIR:=$HOME/SAS-build}"
